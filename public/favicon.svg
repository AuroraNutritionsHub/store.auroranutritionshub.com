<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Squircle Frame -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Stylized Aurora "A" + Dumbbell Core -->
  <g filter="url(#glow)">
    <!-- Left Leg: Gold/Amber -->
    <path d="M19 46 L29 18 C29.5 16.5 31.5 16.5 32 18 L33 21 L23 46 Z" fill="#fbbf24" />
    
    <!-- Right Leg: Cyan/Indigo -->
    <path d="M32 18 C32.5 16.5 34.5 16.5 35 18 L45 46 L39 46 L34 31 Z" fill="#38bdf8" />
    
    <!-- Dynamic Crossbar -->
    <rect x="24" y="34" width="16" height="4" rx="2" fill="url(#auroraGlow)" />
    
    <!-- Top Peak Accent -->
    <circle cx="32" cy="17" r="2.5" fill="#ffffff" />
  </g>
</svg>
